name: Preview audit

on: deployment_status

permissions:
  contents: read

jobs:
  audit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Lighthouse CI against the protected preview (bypass header)
        run: |
          HEADERS=$(jq -nc --arg s "$VERCEL_AUTOMATION_BYPASS_SECRET" \
            '{"x-vercel-protection-bypass": $s, "x-vercel-set-bypass-cookie": "true"}')
          pnpm exec lhci autorun --config=lighthouserc.preview.json \
            --collect.url="$PREVIEW_URL/" \
            --collect.url="$PREVIEW_URL/potaflow" \
            --collect.url="$PREVIEW_URL/classic" \
            --collect.settings.extraHeaders="$HEADERS"

      - name: Preview checks (routes, OG content type, analytics beacon, protection)
        run: pnpm e2e --pass-with-no-tests
